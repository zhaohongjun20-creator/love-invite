<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>约会小软件 · 网页预览</title>
<style>
/* =========================================================
   网页预览版（仅用于看效果，正式交付是微信小程序工程）
   这里用 1:1 的 750px 设计稿 + zoom:0.5 模拟小程序的 rpx
   ========================================================= */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f3edf0; color:#6d4c5b;
  display:flex; justify-content:center; align-items:flex-start;
  min-height:100vh;
}
.phone-wrap { width:375px; overflow:hidden; margin:0 auto; }
.phone {
  width:750px; transform:scale(.5); transform-origin:top left;
  position:relative; overflow-x:hidden;
  background:linear-gradient(165deg,#ffeaf1 0%,#ffd6e4 48%,#ffe0cf 100%);
  padding:20px 48px 80px;
}
.badge {
  position:fixed; left:12px; bottom:12px; z-index:99;
  background:rgba(255,255,255,.92); border:1px solid #ffc9d4; color:#e8556e;
  font-size:12px; padding:6px 12px; border-radius:999px;
  box-shadow:0 6px 16px rgba(232,85,110,.18);
}

/* ---------- 通用 ---------- */
/* 注意：必须用 :not(.on) + !important，否则会被下面 .cover/.invite/.cardpage 的 display:flex 覆盖 */
.screen:not(.on) { display:none !important; }
.card { background:rgba(255,255,255,.94); border-radius:36px; box-shadow:0 20px 50px rgba(238,107,122,.22); padding:40px 36px; }
.h2 { font-size:42px; font-weight:700; color:#e8556e; }
.sub { font-size:26px; color:#9a8d95; line-height:1.7; }
.btn-main {
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#ff8fb0,#e8556e); color:#fff;
  font-size:34px; font-weight:600; letter-spacing:2px;
  border-radius:999px; padding:26px 0; border:none; cursor:pointer;
  box-shadow:0 14px 32px rgba(232,85,110,.32); width:100%;
}
.btn-main:active { transform:scale(.97); }
.btn-ghost {
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.9); color:#e8556e; font-size:30px;
  border:2px solid #ffc9d4; border-radius:999px; padding:22px 0;
  cursor:pointer; box-shadow:0 10px 24px rgba(232,85,110,.14);
}
.btn-ghost:active { transform:scale(.97); background:#fff0f4; }

.bubble {
  position:relative; background:#fff; border:2px solid #ffd6e2; border-radius:28px;
  padding:24px 30px; font-size:30px; line-height:1.6; color:#7a5a68;
  box-shadow:0 10px 26px rgba(232,85,110,.12);
}
.bubble::after {
  content:""; position:absolute; bottom:-18px; left:50%; margin-left:-14px;
  border-left:14px solid transparent; border-right:14px solid transparent; border-top:18px solid #ffd6e2;
}
.bubble::before {
  content:""; position:absolute; bottom:-13px; left:50%; margin-left:-12px; z-index:1;
  border-left:12px solid transparent; border-right:12px solid transparent; border-top:16px solid #fff;
}

/* =========================================================
   二次元少女（与小程序组件 1:1）
   ========================================================= */
.ag { position:relative; display:flex; justify-content:center; }
.box { position:relative; }
.ag.mode-img.ag-sm { height:369px; }
.ag.mode-img.ag-md { height:511px; }
.ag.mode-img.ag-lg { height:624px; }
.ag.mode-vec.ag-sm { height:320px; }
.ag.mode-vec.ag-md { height:500px; }
.ag.mode-vec.ag-lg { height:580px; }
/* AI 立绘：圆角相框（与小程序 1:1） */
.frame {
  position:relative; box-sizing:border-box; overflow:hidden; background:#ffe9ef;
  border:6px solid rgba(255,255,255,.94);
  box-shadow:0 18px 44px rgba(232,85,110,.26), 0 0 0 2px rgba(255,201,212,.85);
  animation:frameIn .5s cubic-bezier(.2,1.4,.4,1);
}
@keyframes frameIn { from { opacity:0; transform:scale(.93); } }
.ag-sm .frame { width:260px; height:369px; border-radius:28px; }
.ag-md .frame { width:360px; height:511px; border-radius:34px; }
.ag-lg .frame { width:440px; height:624px; border-radius:40px; }
.ag-img { width:100%; height:100%; display:block; }
.stage { position:relative; width:420px; height:500px; }
.ag-sm .stage { transform:scale(.62); transform-origin:top center; }
.ag-lg .stage { transform:scale(1.14); transform-origin:top center; }
.bob { position:absolute; left:0; top:0; right:0; bottom:0; animation:bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }

.tail { position:absolute; top:128px; width:78px; height:250px;
  background:linear-gradient(180deg,#f6a2c6,#e87ba8); border-radius:50% / 42% 42% 58% 58%; }
.tail-l { left:2px; transform-origin:top center; animation:swayL 3.6s ease-in-out infinite; }
.tail-r { right:2px; transform-origin:top center; animation:swayR 3.6s ease-in-out infinite; }
@keyframes swayL { 0%,100%{transform:rotate(-13deg)} 50%{transform:rotate(-21deg)} }
@keyframes swayR { 0%,100%{transform:rotate(13deg)} 50%{transform:rotate(21deg)} }

.hair-back { position:absolute; left:42px; top:34px; width:336px; height:362px;
  background:linear-gradient(165deg,#f19ac1,#e0719f); border-radius:50%; }

.body { position:absolute; left:88px; top:360px; width:244px; height:136px;
  background:linear-gradient(180deg,#fff,#ffeff5); border:2px solid #ffdce8; border-radius:122px 122px 26px 26px; }
.sailor { position:absolute; left:52px; top:10px; width:140px; height:74px;
  background:linear-gradient(180deg,#b7e0ff,#93cdf6); border-radius:10px 10px 70px 70px; opacity:.95; }
.bow-chest { position:absolute; left:50%; top:56px; width:58px; height:46px; margin-left:-29px; }
.bow-chest .wing { position:absolute; top:0; width:29px; height:40px; background:#ff8fb0; border-radius:60% 40% 60% 40%; }
.bow-chest .w1 { left:0; transform:rotate(-14deg); }
.bow-chest .w2 { right:0; transform:rotate(14deg) scaleX(-1); }
.bow-chest .knot { position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; background:#ff6f9c; border-radius:50%; }

.neck { position:absolute; left:180px; top:330px; width:60px; height:70px; background:#f2c9b8; border-radius:0 0 30px 30px; }

.head { position:absolute; left:70px; top:55px; width:280px; height:290px;
  background:linear-gradient(180deg,#ffe9df,#ffd9c9); border-radius:50% 50% 46% 46% / 52% 52% 48% 48%; }
.fringe { position:absolute; left:-6px; top:-8px; width:292px; height:118px;
  background:linear-gradient(180deg,#f9aecd,#ef90b7); border-radius:50% 50% 42% 42% / 72% 72% 28% 28%; }
.lock { position:absolute; top:52px; width:46px; height:196px;
  background:linear-gradient(180deg,#f5a3c7,#e88bb4); border-radius:24px 24px 40px 40px; }
.lock-l { left:-8px; } .lock-r { right:-8px; }

.ahoge { position:absolute; left:194px; top:-30px; width:11px; height:74px; background:#f6a2c6; border-radius:11px;
  transform-origin:bottom center; animation:ahoge 2.8s ease-in-out infinite; }
@keyframes ahoge { 0%,100%{transform:rotate(18deg)} 50%{transform:rotate(-10deg)} }

.brow { position:absolute; top:118px; width:48px; height:9px; background:#dd8aa2; border-radius:6px; opacity:.8; transition:all .25s; }
.brow-l { left:50px; transform:rotate(-8deg); } .brow-r { right:50px; transform:rotate(8deg); }

.blush { position:absolute; top:222px; width:48px; height:24px; background:#ff9db4; border-radius:50%; opacity:.4;
  animation:blushPulse 3s ease-in-out infinite; }
.blush-l { left:20px; } .blush-r { right:20px; }
@keyframes blushPulse { 0%,100%{opacity:.3} 50%{opacity:.62} }

.eye { position:absolute; top:142px; width:62px; height:78px; background:#fffdfe; border-radius:50%; overflow:hidden;
  box-shadow:inset 0 -6px 0 rgba(214,178,190,.28); transition:transform .2s, opacity .2s; }
.eye-l { left:46px; } .eye-r { right:46px; }
.pupil { position:absolute; left:50%; top:50%; width:36px; height:40px; margin:-20px 0 0 -18px;
  background:radial-gradient(circle at 34% 28%,#a99cf5,#5a49b8 70%,#3f3287); border-radius:50%; transition:transform .25s; }
.shine { position:absolute; left:5px; top:4px; width:13px; height:13px; background:#fff; border-radius:50%; }
.spark { position:absolute; right:2px; bottom:2px; font-size:20px; color:#ffd166; opacity:0; }
.lid { position:absolute; left:-2px; top:-2px; right:-2px; bottom:-2px; background:#ffdfd1; border-radius:50%;
  transform-origin:top center; transform:scaleY(0); animation:blink 4.6s ease-in-out infinite; }
@keyframes blink { 0%,88%,100%{transform:scaleY(0)} 92%,96%{transform:scaleY(1)} }

.arc { position:absolute; top:158px; width:56px; height:34px; border-top:9px solid #5f4bc0;
  border-radius:60px 60px 0 0; opacity:0; transition:opacity .2s; }
.arc-l { left:49px; } .arc-r { right:49px; }
.heart-eye { position:absolute; top:136px; width:62px; text-align:center; font-size:58px; line-height:84px;
  color:#ff4d79; opacity:0; transition:opacity .25s; }
.heart-l { left:46px; } .heart-r { right:46px; }
.mouth { position:absolute; left:50%; top:246px; width:36px; height:18px; margin-left:-18px; background:#e46b8a;
  border-radius:0 0 36px 36px; transition:all .2s; }

.bow { position:absolute; width:68px; height:54px; }
.bow .wing { position:absolute; top:0; width:35px; height:46px; background:#ff8fb0; border-radius:60% 40% 60% 40%;
  box-shadow:0 4px 10px rgba(232,85,110,.2); }
.bow .w1 { left:0; transform:rotate(-14deg); }
.bow .w2 { right:0; transform:rotate(14deg) scaleX(-1); }
.bow .knot { position:absolute; left:50%; top:50%; width:19px; height:19px; margin:-9px 0 0 -9px; background:#ff6f9c; border-radius:50%; }
.bow-l { left:-16px; top:176px; transform:rotate(-12deg); }
.bow-r { right:-16px; top:176px; transform:rotate(12deg); }

.mood-shy .pupil { transform:translateY(10px); }
.mood-shy .blush { animation-duration:1.6s; }
.mood-shy .blush-l { left:16px; } .mood-shy .blush-r { right:16px; }
.mood-shy .mouth { width:17px; height:19px; margin-left:-8px; border-radius:50%; top:248px; }
.mood-shy .brow-l { transform:rotate(11deg); top:113px; }
.mood-shy .brow-r { transform:rotate(-11deg); top:113px; }

.mood-happy .eye { opacity:0; }
.mood-happy .arc { opacity:1; }
.mood-happy .mouth { width:50px; height:27px; margin-left:-25px; border-radius:0 0 50px 50px; }
.mood-happy .brow-l { transform:rotate(-11deg); } .mood-happy .brow-r { transform:rotate(11deg); }

.mood-excited .eye { transform:scale(1.12); }
.mood-excited .pupil { transform:scale(1.1); }
.mood-excited .spark { opacity:1; animation:sparkle 1s ease-in-out infinite; }
.mood-excited .mouth { width:44px; height:38px; margin-left:-22px; border-radius:12px 12px 44px 44px; background:#d9557a; }
@keyframes sparkle { 0%,100%{transform:scale(.6) rotate(0)} 50%{transform:scale(1.15) rotate(22deg)} }

.mood-love .eye { opacity:0; }
.mood-love .heart-eye { opacity:1; }
.mood-love .mouth { width:32px; height:17px; margin-left:-16px; }
.mood-love .blush { animation-duration:1.3s; }
.mood-love .brow-l { transform:rotate(-4deg); } .mood-love .brow-r { transform:rotate(4deg); }

.fly { position:absolute; font-size:34px; color:#ff6f9c; opacity:0; }
.fly-1 { left:56px; top:120px; } .fly-2 { right:62px; top:168px; } .fly-3 { left:128px; top:76px; }
.mood-love .fly { animation:floatHeart 2.4s ease-out infinite; }
.mood-love .fly-1 { animation-delay:0s; } .mood-love .fly-2 { animation-delay:.8s; } .mood-love .fly-3 { animation-delay:1.6s; }
@keyframes floatHeart { 0%{transform:translateY(0) scale(.7);opacity:0} 25%{opacity:1} 100%{transform:translateY(-150px) scale(1.15);opacity:0} }

/* =========================================================
   封面
   ========================================================= */
.cover { display:flex; flex-direction:column; align-items:center; }
.char-switch { display:flex; margin-top:22px; background:rgba(255,255,255,.72); border:2px solid #ffd6e2; border-radius:999px; padding:6px; }
.cs-item { padding:12px 32px; border-radius:999px; font-size:26px; color:#b0395c; cursor:pointer; }
.cs-item.on { background:linear-gradient(135deg,#ff8fb0,#e8556e); color:#fff; box-shadow:0 6px 16px rgba(232,85,110,.28); }
.cover .girl { margin-top:10px; }
.cover .bubble-wrap { width:100%; margin-top:34px; cursor:pointer; }
.cover .title { margin-top:44px; font-size:58px; font-weight:700; color:#e8556e; letter-spacing:6px;
  text-shadow:0 6px 16px rgba(232,85,110,.18); }
.cover .slogan { margin-top:14px; font-size:26px; color:#a58c97; }
.cover .start-btn { margin-top:48px; }
.last { width:100%; margin-top:34px; padding:30px 32px; cursor:pointer; }
.last-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.last-title { font-size:30px; font-weight:600; color:#e8556e; }
.countdown { font-size:24px; color:#fff; background:linear-gradient(135deg,#ff8fb0,#e8556e); border-radius:999px; padding:6px 18px; }
.last-row { font-size:27px; color:#7a5a68; line-height:1.9; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.last-tip { margin-top:12px; font-size:23px; color:#b9a3ad; text-align:right; }

/* =========================================================
   邀请流程
   ========================================================= */
.invite { display:flex; flex-direction:column; align-items:center; }
.steps { display:flex; align-items:flex-start; justify-content:center; margin-bottom:6px; }
.step-item { display:flex; flex-direction:column; align-items:center; width:96px; }
.dot { width:46px; height:46px; border-radius:50%; background:#ffe3ec; color:#d2a5b4; font-size:24px;
  display:flex; align-items:center; justify-content:center; transition:all .25s; }
.dot.on { background:linear-gradient(135deg,#ff8fb0,#e8556e); color:#fff; box-shadow:0 8px 18px rgba(232,85,110,.3); }
.dot-label { margin-top:8px; font-size:21px; color:#c4aab4; }
.dot-label.on { color:#e8556e; font-weight:600; }
.step-line { width:88px; height:4px; background:#ffe3ec; border-radius:4px; margin-top:22px; }
.step-line.on { background:#ffb0c6; }
.invite .bubble-main { width:100%; margin-top:24px; text-align:center; }
.panel { width:100%; margin-top:40px; animation:rise .4s ease-out; }
@keyframes rise { from{opacity:0;transform:translateY(24px)} }
.opts { display:flex; flex-direction:column; }
.opt { display:flex; align-items:center; background:linear-gradient(135deg,#fff3f6,#ffe6ee); border:2px solid #ffc9d4;
  border-radius:24px; padding:24px 26px; margin-bottom:18px; transition:all .18s; cursor:pointer; }
.opt:active { transform:scale(1.02); background:#ffd9e4; }
.opt .ico { font-size:40px; margin-right:18px; }
.opt .txt { flex:1; font-size:29px; color:#b0395c; line-height:1.4; }
.opt.custom { background:#fff; padding:14px 20px; cursor:default; }
.opt.custom:active { transform:none; background:#fff; }
.ipt { flex:1; font-size:28px; color:#c2185b; padding:10px 6px; border:none; outline:none; background:transparent; }
.ipt::placeholder { color:#d8aab6; font-size:25px; }
.mini { background:linear-gradient(135deg,#ff8fb0,#e8556e); color:#fff; border-radius:999px; padding:14px 24px;
  font-size:25px; margin-left:12px; white-space:nowrap; border:none; cursor:pointer; }
.mini:active { transform:scale(.94); }
.opt.date-row { flex-wrap:wrap; padding:16px 20px; cursor:default; }
.opt.date-row:active { transform:none; }
.pk { background:#fff6f9; border:2px dashed #f8b3c3; border-radius:14px; padding:10px 16px; margin-right:12px; cursor:pointer; }
.pk-text { font-size:26px; color:#c2185b; }
.pk input { border:none; background:transparent; font-size:24px; color:#c2185b; outline:none; width:190px; }
.back { margin-top:12px; font-size:26px; color:#b9a3ad; padding:16px 30px; cursor:pointer; }
.back:active { color:#e8556e; }
.no-btn { position:absolute; z-index:30; background:#fff; border:2px dashed #f48fb1; color:#f06292;
  border-radius:999px; padding:18px 34px; font-size:27px; cursor:pointer;
  box-shadow:0 10px 24px rgba(240,98,146,.25); transition:left .18s ease-out, top .18s ease-out, transform .18s; }

/* =========================================================
   清单卡片
   ========================================================= */
.cardpage { display:flex; flex-direction:column; align-items:center; }
.cardpage .title { margin-top:10px; }
.cardpage .tips { margin-top:10px; text-align:center; }
.list { width:100%; margin-top:34px; padding:34px 32px; }
.row { display:flex; flex-direction:column; padding:16px 0; border-bottom:2px dashed #ffe0ea; }
.row:last-of-type { border-bottom:none; }
.k { font-size:25px; color:#b9a3ad; }
.v { margin-top:8px; font-size:31px; color:#c2185b; font-weight:600; line-height:1.5; word-break:break-all; }
.count { margin-top:26px; text-align:center; font-size:28px; color:#fff;
  background:linear-gradient(135deg,#ff8fb0,#e8556e); border-radius:999px; padding:14px 0; }
.btns { width:100%; margin-top:36px; display:flex; flex-direction:column; }
.row2 { display:flex; margin:20px 0; gap:20px; }
.flex1 { flex:1; }
.preview { width:100%; margin-top:40px; display:flex; flex-direction:column; align-items:center; }
.preview img { width:100%; border-radius:30px; box-shadow:0 18px 44px rgba(232,85,110,.24); }
.preview-tip { margin-top:18px; font-size:24px; color:#b9a3ad; }
#cardCanvas { position:absolute; left:-3000px; top:0; width:375px; height:540px; }
.empty { width:100%; margin-top:120px; display:flex; flex-direction:column; align-items:center; padding:70px 40px; }
.empty-icon { font-size:84px; margin-bottom:20px; }
.bg-heart { position:absolute; top:-60px; font-size:30px; opacity:.55; pointer-events:none; animation:bgFall linear infinite; }
@keyframes bgFall { to { transform:translateY(1300px) rotate(360deg); opacity:.12; } }
.music-btn { position:absolute; right:32px; top:32px; z-index:40; width:84px; height:84px; border-radius:50%;
  background:rgba(255,255,255,.92); border:2px solid #ffc9d4; display:flex; align-items:center; justify-content:center;
  font-size:40px; cursor:pointer; box-shadow:0 10px 26px rgba(232,85,110,.2); }
</style>
</head>
<body>
<div class="badge">网页预览版 · 正式交付为微信小程序工程</div>

<div class="phone-wrap" id="phoneWrap">
<div class="phone" id="phone">

  <!-- ================= 封面 ================= -->
  <section class="screen on cover" id="scrCover">
    <div class="girl">
      <div class="ag ag-lg mood-happy"><div class="box" data-char="cover"></div></div>
    </div>
    <div class="char-switch" id="charSwitch"></div>
    <div class="bubble-wrap" onclick="changeLine()">
      <div class="bubble" id="coverLine"></div>
    </div>
    <div class="title">约会小软件</div>
    <div class="slogan">和 小桃 一起，把这一天定下来</div>
    <div class="btn-main start-btn" onclick="goInvite()">💌 开始约会邀请</div>
    <div class="card last" id="lastCard" style="display:none" onclick="goCard()">
      <div class="last-head">
        <span class="last-title">上次定下的约会</span>
        <span class="countdown" id="lastCount"></span>
      </div>
      <div class="last-row" id="lastTime"></div>
      <div class="last-row" id="lastPlace"></div>
      <div class="last-row" id="lastAct"></div>
      <div class="last-tip">点这里查看清单卡片 →</div>
    </div>
    <div class="music-btn" onclick="toggleMusic()" id="musicIcon">🎵</div>
  </section>

  <!-- ================= 邀请流程 ================= -->
  <section class="screen invite" id="scrInvite">
    <div class="steps" id="steps"></div>
    <div class="girl">
      <div class="ag ag-md mood-shy"><div class="box" data-char="invite"></div></div>
    </div>
    <div class="bubble bubble-main" id="inviteLine"></div>
    <div class="panel" id="panel"></div>
    <div class="back" id="backBtn" style="display:none" onclick="goStep(step-1)">← 上一步</div>
  </section>

  <!-- ================= 清单 ================= -->
  <section class="screen cardpage" id="scrCard">
    <div class="girl">
      <div class="ag ag-sm mood-love"><div class="box" data-char="card"></div></div>
    </div>
    <div class="h2 title">约会清单生成啦！</div>
    <div class="sub tips">就这么说定啦，不许反悔哦 🥺</div>
    <div class="card list">
      <div class="row"><span class="k">🕐 时间</span><span class="v" id="cTime"></span></div>
      <div class="row"><span class="k">📍 地点</span><span class="v" id="cPlace"></span></div>
      <div class="row"><span class="k">💫 做什么</span><span class="v" id="cAct"></span></div>
      <div class="row"><span class="k">💌 备注</span><span class="v" id="cNote"></span></div>
      <div class="count" id="cCount" style="display:none"></div>
    </div>
    <div class="btns">
      <div class="btn-main" onclick="makeCard()">🖼️ 生成清单卡片</div>
      <div class="row2">
        <div class="btn-ghost flex1" onclick="copyText()">📋 复制告白</div>
        <div class="btn-ghost flex1" onclick="goInvite(true)">🔄 重新定一次</div>
      </div>

let curSet = 'girl';
try { curSet = localStorage.getItem('love_char_set') || 'girl'; } catch (e) {}
if (!CHAR_SETS[curSet]) curSet = 'girl';

function currentImages() { return CHAR_SETS[curSet].images; }
function currentName() { return CHAR_SETS[curSet].name; }

const moodsByScope = {};

function setMood(scope, mood) {
  moodsByScope[scope] = mood;
  const ag = document.querySelector('#' + scope + ' .ag');
  if (!ag) return;
  ag.className = 'ag ' + ag.classList[1] + ' mode-img mood-' + mood;
  const img = ag.querySelector('.ag-img');
  if (img) img.src = currentImages()[mood] || currentImages().normal;
}

function refreshAllChars() {
  Object.keys(moodsByScope).forEach(function (s) { setMood(s, moodsByScope[s]); });
}

let charSwitchBound = false;
function buildCharSwitch() {
  const box = document.getElementById('charSwitch');
  if (!box) return;
  box.innerHTML = Object.keys(CHAR_SETS).map(function (k) {
    const s = CHAR_SETS[k];
    return '<div class="cs-item' + (k === curSet ? ' on' : '') + '" data-key="' + k + '">' +
           s.avatar + ' ' + s.label + '</div>';
  }).join('');
  if (charSwitchBound) return;
  charSwitchBound = true;
  box.addEventListener('click', function (ev) {
    const item = ev.target.closest('.cs-item');
    if (item) setCharSet(item.getAttribute('data-key'));
  });
}

/* ---- canvas 卡片 ---- */
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function wrapText(g,text,x,y,maxW,lh){
  const cs = String(text).split(''); let line='', yy=y;
  for (const c of cs) {
    const t = line + c;
    if (g.measureText(t).width > maxW && line) { g.fillText(line,x,yy); line=c; yy+=lh; }
    else line=t;
  }
  if (line) { g.fillText(line,x,yy); yy+=lh; }
  return yy - lh + 6;
}
function drawCard(g, W, H, portrait) {
  const hasPortrait = !!(portrait && portrait.width && portrait.height);
  const grad=g.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#ffdde1'); grad.addColorStop(.55,'#ffb8c8'); grad.addColorStop(1,'#ffc9a8');
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.95)'; roundRect(g,55,58,640,964,42); g.fill();

  if (hasPortrait) {
    const pw=224, ph=318, px=375-pw/2, py=96;
    g.save(); roundRect(g,px,py,pw,ph,30); g.clip();
    const s=Math.max(pw/portrait.width, ph/portrait.height);
    const dw=portrait.width*s, dh=portrait.height*s;
    g.drawImage(portrait, px+(pw-dw)/2, py+(ph-dh)/2, dw, dh);
    g.restore();
    g.strokeStyle='rgba(255,255,255,.96)'; g.lineWidth=8;
    roundRect(g,px+4,py+4,pw-8,ph-8,26); g.stroke();
    g.textAlign='center'; g.font='30px sans-serif'; g.fillStyle='#ff9db4';
    g.fillText('💗', px-34, py+40); g.fillText('💗', px+pw+34, py+ph-26);
  } else {
    g.textAlign='center'; g.font='76px sans-serif'; g.fillText('💌',375,250);
  }

  const titleY = hasPortrait ? 486 : 430;
  g.textAlign='center'; g.fillStyle='#e8556e'; g.font='bold 48px sans-serif';
  g.fillText('约会确认书',375,titleY);
  g.fillStyle='#9a8d95'; g.font='25px sans-serif'; g.fillText('已由本人郑重勾选 ♥',375,titleY+42);
  g.strokeStyle='#ffdce6'; g.lineWidth=2;
  g.beginPath(); g.moveTo(120,titleY+80); g.lineTo(630,titleY+80); g.stroke();

  const cells=[['🕐 时间',plan.time],['📍 地点',plan.place],['💫 做什么',plan.act],['💌 备注',plan.note]];
  const colX=[112,402], y0=titleY+142;
  let gridBottom=0;
  cells.forEach((c,i)=>{
    const x=colX[i%2], y=y0+Math.floor(i/2)*128;
    g.textAlign='left'; g.fillStyle='#b9a3ad'; g.font='25px sans-serif'; g.fillText(c[0],x,y);
    g.fillStyle='#c2185b'; g.font='bold 29px sans-serif';
    const after=wrapText(g,String(c[1]||'—'),x,y+42,266,38);
    if(after>gridBottom) gridBottom=after;
  });

  const ct=countText(plan);
  if (ct){
    g.textAlign='center'; g.font='25px sans-serif';
    const tw=g.measureText(ct).width, bw=tw+62, by=gridBottom+22;
    if (by+52 < 936) {
      g.fillStyle='#ffe3ec'; roundRect(g,375-bw/2,by,bw,52,26); g.fill();
      g.fillStyle='#e8556e'; g.fillText(ct,375,by+35);
    }
  }
  g.textAlign='center'; g.fillStyle='#b0395c'; g.font='27px sans-serif';
  g.fillText('— 来自那个想和你约会的人 💘',375,972);
}
function makeCard() {
  const W=750,H=1080,dpr=2;
  const cv=$('cardCanvas'); cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr);
  let done=false;

    const box=$('previewBox'), hold=$('canvasHold'), imgEl=$('previewImg');

/* ================= 八音盒 BGM ================= */
let ac=null, mg=null, muted=false, started=false, bar=0;
const N={A3:220,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G3:196,G4:392,A4:440,B4:493.88,
         C5:523.25,D5:587.33,E5:659.25,G5:783.99};
const PROG=[
  {arp:[N.A3,N.E4,N.A4,N.C5],mel:N.E5},
  {arp:[N.F4*.5,N.C4,N.F4,N.A4],mel:N.C5},
  {arp:[N.C4,N.G4,N.C5,N.E5],mel:N.G5},
  {arp:[N.G3,N.D4,N.G4,N.B4],mel:N.D5}
];
function mbox(freq,when,dur,vol){
  const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();
  o.type='sine'; o.frequency.value=freq; o2.type='sine'; o2.frequency.value=freq*3; g2.gain.value=.16;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(mg);
  g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(vol,when+.012);
  g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.start(when); o2.start(when); o.stop(when+dur+.05); o2.stop(when+dur+.05);
}
function barPlay(){
  const t0=ac.currentTime+.08, c=PROG[bar%PROG.length];
  c.arp.forEach((f,i)=>mbox(f,t0+i*.5,1.6,.2));
  mbox(c.mel,t0,1.9,.09); bar++;
}
function startBgm(){
  if(started) return; started=true;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain(); mg.gain.value=muted?0:.5; mg.connect(ac.destination);
    barPlay(); setInterval(()=>{ if(!muted) barPlay(); },2000);
  }catch(e){}
}
function toggleMusic(){
  muted=!muted;
  if(!started && !muted) startBgm();
  if(mg) mg.gain.value = muted?0:.5;
  $('musicIcon').textContent = muted?'🔇':'🎵';
}
window.addEventListener('pointerdown', startBgm, {once:true});

    h.style.fontSize=(22+Math.random()*26)+'px'; h.style.animationDuration=(5+Math.random()*5)+'s';
    $('phone').appendChild(h);
    setTimeout(()=>h.remove(),11000);
  },600);
})();

/* ================= 启动 ================= */
buildCharSwitch();
const sloganEl = document.querySelector('.cover .slogan');
if (sloganEl) sloganEl.textContent = '和 ' + currentName() + ' 一起，把这一天定下来';
renderCover();
renderInvite();
showScreen('scrCover');
jumpNo();
</script>
